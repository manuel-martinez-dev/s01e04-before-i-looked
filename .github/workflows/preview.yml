# Plan morning-digest § 3/4, ADR 0003. Renders one page and deploys it to Pages; the HTML is never
# committed. Marker comes from the LANE_MARKER repo variable; delete the variable and re-run to clean up.
name: preview

on:
  workflow_dispatch:
    inputs:
      night:
        description: Night to preview (YYYY-MM-DD)
        default: '2026-10-28'
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      LANE_MARKER: ${{ vars.LANE_MARKER }}
      NIGHT: ${{ inputs.night }}
      PORT: '8787'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Save the page
        run: |
          [[ "$NIGHT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "bad night"; exit 1; }
          pnpm start > rig.log 2>&1 &
          for i in $(seq 30); do curl -fsS "http://localhost:$PORT/health" >/dev/null 2>&1 && break; sleep 1; done
          mkdir -p _site
          curl -fsS "http://localhost:$PORT/digest/$NIGHT" -o _site/index.html
          grep -q '>no marker set<' _site/index.html && echo 'banner: no marker set' || echo 'banner: marker set'
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
